<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="title desc">
<title id="title">Railguard</title>
<desc id="desc">The agent proposes, Railguard checks. Your task goes to the agent, the agent acts and Railguard checks the action: if it fails, the reason goes back as feedback and the agent fixes it; if it passes, the change is verified.</desc>
<defs><marker id="a-flow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#7C98FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a-warn" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#F2B84B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a-fix" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#A994FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a-pass" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#55C48C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="1" y="1" width="958" height="398" rx="20" fill="#101319" stroke="#2E3440" stroke-width="2"/>
<g transform="translate(48 44)"><rect x="2" y="12" width="24" height="4" rx="2" fill="#FF7A45"/><circle cx="8" cy="14" r="5" fill="#181C24" stroke="#E8E6E1" stroke-width="3"/><circle cx="20" cy="14" r="5" fill="#E8E6E1"/></g>
<text x="86" y="64" fill="#E8E6E1" font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="22" font-weight="700">Railguard</text>
<text fill="#E8E6E1" font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="-.5"><tspan x="48" y="164">The agent proposes.</tspan><tspan x="48" y="208">Railguard checks.</tspan></text>
<text fill="#9AA0AB" font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="17" font-weight="500"><tspan x="48" y="262">Skills and deterministic guardrails</tspan><tspan x="48" y="288">for Claude Code, Codex and Cursor.</tspan></text>
<text x="48" y="348" fill="#FF7A45" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" letter-spacing="1.2">SKILLS TEACH · CHECKS DECIDE</text>
<g transform="translate(408 68) scale(.76)"><path d="M103 92L136 92" stroke="#7C98FF" stroke-width="3" stroke-linecap="round" marker-end="url(#a-flow)"/><path d="M236 92L269 92" stroke="#7C98FF" stroke-width="3" stroke-linecap="round" marker-end="url(#a-flow)"/><path d="M369 92L402 92" stroke="#7C98FF" stroke-width="3" stroke-linecap="round" marker-end="url(#a-flow)"/><path d="M502 92L569 92" stroke="#55C48C" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 7" marker-end="url(#a-pass)"/><text x="536.5" y="80" fill="#55C48C" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" letter-spacing=".9" text-anchor="middle" dominant-baseline="middle">PASSES</text><path d="M453 141L453 211" stroke="#F2B84B" stroke-width="3" stroke-linecap="round" marker-end="url(#a-warn)"/><text x="465" y="177" fill="#F2B84B" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" letter-spacing=".9" text-anchor="start" dominant-baseline="middle">FAILS</text><path d="M404 262L371 262" stroke="#A994FF" stroke-width="3" stroke-linecap="round" marker-end="url(#a-fix)"/><path d="M320 213L320 143" stroke="#A994FF" stroke-width="3" stroke-linecap="round" marker-end="url(#a-fix)"/><circle cx="54" cy="92" r="42" fill="#181C24" stroke="#7C98FF" stroke-width="2.5"/><g transform="translate(40.6 68.6) scale(1.12)" fill="none" stroke="#7C98FF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2"/></g><text x="54" y="113" fill="#E8E6E1" font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Your task</text><circle cx="187" cy="92" r="42" fill="#181C24" stroke="#7C98FF" stroke-width="2.5"/><g transform="translate(173.6 68.6) scale(1.12)" fill=