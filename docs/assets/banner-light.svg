13" font-weight="700" text-anchor="middle">Verified</text><circle cx="453" cy="262" r="42" fill="#FFFFFF" stroke="#C98A0E" stroke-width="2.5"/><g transform="translate(439.6 238.6) scale(1.12)" fill="none" stroke="#C98A0E" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11h-9l-4 4v-4H4z"/><path d="M8.5 10.5h.01M12 10.5h.01M15.5 10.5h.01"/></g><text x="453" y="283" fill="#1A1D23" font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Feedback</text><circle cx="320" cy="262" r="42" fill="#FFFFFF" stroke="#6D4FD8" stroke-width="2.5"/><g transform="translate(306.6 238.6) scale(1.12)" fill="none" stroke="#6D4FD8" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L4 17l3 3 5.3-5.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.5-.5-.5-2.5z"/></g><text x="320" y="283" fill="#1A1D23" font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Fix</text></g>
