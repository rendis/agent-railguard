<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="title desc">
<title id="title">Railguard</title>
<desc id="desc">The agent proposes, Railguard checks. Your task goes to the agent, the agent acts and Railguard checks the action: if it fails, the reason goes back as feedback and the agent fixes it; if it passes, the change is verified.</desc>
<defs><marker id="a-flow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#2F5BEA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a-warn" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#C98A0E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a-fix" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#6D4FD8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a-pass" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#23905A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="1" y="1" width="958" height="398" rx="20" fill="#F6F4EF" stroke="#DCD6CA" stroke-width="2"/>
<g transform="translate(48 44)"><rect x="2" y="12" width="24" height="4" rx="2" fill="#E0531F"/><circle cx="8" cy="14" r="5" fill="#FFFFFF" stroke="#1A1D23" stroke-width="3"/><circle cx="20" cy="14" r="5" fill="#1A1D23"/></g>
<text x="86" y="64" fill="#1A1D23" font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="22" font-weight="700">Railguard</text>
<text fill="#1A1D23" font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="-.5"><tspan x="48" y="164">The agent proposes.</tspan><tspan x="48" y="208">Railguard checks.</tspan></text>
<text fill="#676C75" font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="17" font-weight="500"><tspan x="48" y="262">Skills and deterministic guardrails</tspan><tspan x="48" y="288">for Claude Code, Codex and Cursor.</tspan></text>
<text x="48" y="348" fill="#E0531F" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" letter-spacing="1.2">SKILLS TEACH · CHECKS DECIDE</text>
