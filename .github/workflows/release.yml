name: Release

# A release is the version in package.json on main: merging a version bump publishes it, and
# every other push to main finds its release already published and stops.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Decide whether this version is unreleased
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Releases are published from main only, not $GITHUB_REF."
            exit 1
          fi
          tag="v$(node -p 'require("./package.json").version')"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag is already released; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A tag without its release must already name this commit, or the binaries would not match it.
          # gh prints an error body on stdout, so its exit status, not its output, says whether the tag exists.
          if tagged=$(gh api "repos/$GH_REPO/commits/refs/tags/$tag" --jq .sha 2>/dev/null); then
            if [ "$tagged" != "$GITHUB_SHA" ]; then
              echo "::error::Tag $tag points to $tagged, not $GITHUB_SHA. Bump package.json or remove the tag."
              exit 1
            fi
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - if: steps.version.outputs.publish == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: steps.version.outputs.publish == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - if: steps.version.outputs.publish == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - if: steps.version.outputs.publish == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.6
          cache: false
      - if: steps.version.outputs.publish == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.version.outputs.publish == 'true'
        run: pnpm run check
      - if: steps.version.outputs.publish == 'true'
        run: node scripts/build-binaries.mjs
      # GitHub does not offer attestations for private repositories owned by a user account.
      - if: steps.version.outputs.publish == 'true' && !github.event.repository.private
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/bin/SHA256SUMS
      - name: Publish GitHub release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
        # Creates the tag on the commit just built and verified when it does not exist yet.
        run: gh release create "$TAG" dist/bin/* --target "$GITHUB_SHA" --title "$TAG" --generate-notes
