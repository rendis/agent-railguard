version: "2"

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

linters:
  default: none
  enable:
    - bodyclose
    - contextcheck
    - dupl
    - errcheck
    - errorlint
    - gocognit
    - goconst
    - gocritic
    - godoclint
    - godox
    - gosec
    - govet
    - ineffassign
    - noctx
    - nolintlint
    - revive
    - staticcheck
    - thelper
    - unused
    - usetesting
  settings:
    dupl:
      threshold: 100
    gocognit:
      min-complexity: 10
    goconst:
      ignore-tests: true
      min-len: 3
      min-occurrences: 3
    godoclint:
      default: basic
      enable:
        - require-doc
      options:
        require-doc:
          ignore-exported: false
          ignore-unexported: true
          include-tests: false
        start-with-name:
          include-unexported: false
          include-tests: false
    godox:
      keywords:
        - FIXME
        - TODO
    nolintlint:
      allow-unused: false
      require-explanation: true
      require-specific: true
    revive:
      enable-all-rules: false
      rules:
        - name: bare-return
        - name: confusing-results
        - name: early-return
        - name: empty-block
        - name: import-shadowing
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: unconditional-recursion
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gocognit
          - godoclint

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
