version: "2"

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

linters:
  default: none
  enable:
    - bodyclose
    - contextcheck
    - cyclop
    - dupl
    - durationcheck
    - errcheck
    - errorlint
    - fatcontext
    - funlen
    - gocognit
    - goconst
    - gocritic
    - godoclint
    - godox
    - gosec
    - govet
    - ineffassign
    - loggercheck
    - maintidx
    - musttag
    - nestif
    - nilerr
    - nilnil
    - noctx
    - nolintlint
    - revive
    - sloglint
    - staticcheck
    - testifylint
    - thelper
    - unused
    - usetesting
    - wastedassign
  settings:
    cyclop:
      max-complexity: 5
      package-average: 0
    dupl:
      threshold: 100
    funlen:
      lines: 80
      statements: 40
      ignore-comments: true
    gocognit:
      min-complexity: 6
    goconst:
      ignore-tests: true
      ignore-calls: false
      min-len: 3
      min-occurrences: 3
    godoclint:
      default: basic
      enable:
        - require-doc
      options:
        require-doc:
          ignore-exported: false
          ignore-unexported: true
          include-tests: false
        start-with-name:
          include-unexported: false
          include-tests: false
    godox:
      keywords:
        - FIXME
        - TODO
    maintidx:
      under: 20
    nestif:
      min-complexity: 4
    nolintlint:
      allow-unused: false
      require-explanation: true
      require-specific: true
    revive:
      enable-all-rules: false
      rules:
        - name: argument-limit
          arguments: [7]
        - name: bare-return
        - name: confusing-results
        - name: early-return
        - name: empty-block
        - name: import-shadowing
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: unconditional-recursion
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - cyclop
          - funlen
          - gocognit
          - godoclint
          - maintidx
          - nestif
          - nilnil

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
