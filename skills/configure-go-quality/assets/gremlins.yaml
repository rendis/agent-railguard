unleash:
  output-statuses: lct
  workers: 1
  # Railguard runs Gremlins with --test-cpu=0: v0.6 passes a non-zero value to go test as one
  # invalid argument, so every test run fails and every covered mutant reads as KILLED.
  test-cpu: 0
  timeout-coefficient: 50
  # Railguard's go-mutation check applies the verdict (no LIVED or NOT COVERED mutant on a
  # changed line) because Gremlins v0.6 thresholds cannot express that policy.
  threshold:
    efficacy: 0
    mutant-coverage: 0

mutants:
  arithmetic-base:
    enabled: true
  conditionals-boundary:
    enabled: true
  conditionals-negation:
    enabled: true
  increment-decrement:
    enabled: true
  invert-assignments:
    enabled: true
  invert-bitwise:
    enabled: true
  invert-bwassign:
    enabled: true
  invert-logical:
    enabled: true
  invert-loopctrl:
    enabled: true
  invert-negatives:
    enabled: true
  remove-self-assignments:
    enabled: true
